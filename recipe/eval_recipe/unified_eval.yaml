model:
  model_name: Rosetta
  rosetta_config:
    base_model: Qwen/Qwen3-8B
    teacher_model: Qwen/Qwen2.5-7B-Instruct
    is_do_alignment: false
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/C2C_Fuser/qwen3_8b+qwen2.5_7b_Fuser/final
  
  # Two stage
  # model_name: "two_stage"  # Use two-stage pipeline
  # answer_model_path: "Qwen/Qwen3-0.6B" # Second LLM for answering
  # context_model_path: "Qwen/Qwen3-4B"
  # background_prompt: "In one clear sentence, describe the most essential background knowledge needed to answer the question: {question}"

  # Generation configuration - applied to all models during evaluation
  generation_config:
    do_sample: true  # Whether to use sampling (true) or greedy decoding (false)
    max_new_tokens: 8192  # Maximum number of tokens to generate
    # Sampling parameters (only used when do_sample=true):
    temperature: 0.7  # Controls randomness (0.0 = deterministic, higher = more random)
    top_p: 0.8  # Nucleus sampling threshold
    top_k: 20  # Top-k sampling threshold
    min_p: 0.05  # Minimum probability threshold
    repetition_penalty: 1.0  # Penalty for repeating tokens
    presence_penalty: 1.5  # Penalty for repeating tokens
    frequency_penalty: 1.0

output:
  output_dir: local/final_results/qwen3_8b+qwen2.5_7b_Fuser

eval:
  dataset: ai2-arc
  # gpu_ids are interpreted relative to CUDA_VISIBLE_DEVICES.
  # Example: CUDA_VISIBLE_DEVICES=2,3 + gpu_ids: [0,1] => physical GPU 2 and 3.
  # Example: CUDA_VISIBLE_DEVICES=0 + gpu_ids: [0] => physical GPU 0 only.
  gpu_ids: [0]
  answer_method: generate  # 'generate' or 'logits'
  use_cot: true  # Enable chain-of-thought reasoning
  use_template: true
  sample_interval: 1  # Sample every N examples
  # limit:   # Limit examples per subject (null for all) — backward compatible
  # subjects: ["nutrition"] # Optional: specify specific subjects to evaluate
  # response_text: ""
  math_grading_method: "comprehensive"

  # ── Dataset slicing (new) ──────────────────────────────────────────
  # start_index: first sample index to evaluate (default 0)
  # num_of_tasks: how many samples from start_index (null = until end)
  # Applied BEFORE virtual split (multi-GPU) and BEFORE legacy limit.
  start_index: 0
  num_of_tasks: 300

  # ── Cache analysis (new) ───────────────────────────────────────────
  cache_analysis:
    enabled: true          # Set to true to activate key-cache diagnostics
    target: key             # Only "key" is supported

    # --- Entropy settings (logit-lens based) ---
    entropy_space: logit_lens
    logit_lens_temperature: 1.0

    # --- KL divergence settings (raw key-cache magnitude distribution) ---
    kl_space: raw_key_cache
    kl_vector_align: last   # "last" or "first" — how to align vectors of different lengths

    # --- General ---
    save_raw_cache: false            # Save per-sample per-layer .pt tensors (large!)
    max_pca_points_per_layer: 2500   # Max points per cache_name in PCA scatter
    pca_sample_seed: 42
    entropy_eps: 1.0e-12
    kl_eps: 1.0e-12
