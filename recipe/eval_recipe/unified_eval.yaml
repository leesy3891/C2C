model:
  # model_name: Qwen/Qwen3-0.6B
  model_name: Rosetta
  rosetta_config:
    base_model: Qwen/Qwen3-8B
    teacher_model: Qwen/Qwen2.5-7B-Instruct
    is_do_alignment: true
    alignment_strategy: "longest"
    checkpoints_dir: local/checkpoints/C2C_Fuser/qwen3_8b+qwen2.5_7b_Fuser/final

  # Two stage
  # model_name: "two_stage"
  # answer_model_path: "Qwen/Qwen3-0.6B"
  # context_model_path: "Qwen/Qwen3-4B"
  # background_prompt: "In one clear sentence, describe the most essential background knowledge needed to answer the question: {question}"

  generation_config:
    do_sample: true
    max_new_tokens: 64
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.05
    repetition_penalty: 1.0
    presence_penalty: 1.5
    frequency_penalty: 1.0

output:
  output_dir: local/final_results/qwen3_8b+qwen2.5_7b_Fuser

eval:
  dataset: gpqa

  # gpu_ids are interpreted relative to CUDA_VISIBLE_DEVICES.
  # Example: CUDA_VISIBLE_DEVICES=3 + gpu_ids: [0] => physical GPU 3.
  gpu_ids: [0]

  answer_method: generate
  use_cot: false
  use_template: true
  sample_interval: 1
  # limit:
  # subjects: ["nutrition"]
  # response_text: ""
  math_grading_method: "comprehensive"

  # Dataset slicing
  start_index: 0
  num_of_tasks: null

  # Cache analysis
  cache_analysis:
    enabled: false
    target: key

    entropy_space: logit_lens
    logit_lens_temperature: 1.0

    kl_space: raw_key_cache
    kl_vector_align: last

    save_raw_cache: false
    max_pca_points_per_layer: 2000
    pca_sample_seed: 42
    entropy_eps: 1.0e-12
    kl_eps: 1.0e-12
